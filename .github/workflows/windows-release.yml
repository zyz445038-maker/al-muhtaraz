name: Windows desktop release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-draft-release:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      WINDOWS_CODE_SIGNING_CERTIFICATE_SHA256: ${{ vars.WINDOWS_CODE_SIGNING_CERTIFICATE_SHA256 }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Validate release configuration
        shell: pwsh
        run: |
          if (-not $env:NEXT_PUBLIC_SUPABASE_URL -or -not $env:NEXT_PUBLIC_SUPABASE_ANON_KEY) {
            throw 'Set the NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY secrets in the release. environment before releasing.'
          }
          $packageVersion = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read the package.json version.'
          }
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw 'The release tag must match the package.json version.'
          }

      - name: Validate release signing secret
        shell: pwsh
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          if (-not $env:UPDATE_ED25519_PRIVATE_KEY) {
            throw 'Set the UPDATE_ED25519_PRIVATE_KEY secret in the release environment before releasing.'
          }

      - name: Prepare Windows code-signing certificate
        id: prepare-signing
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./scripts/prepare-windows-signing.ps1

      - name: Install dependencies
        run: npm ci

      - name: Test signed update manifest verification
        run: npm run test:update-manifest

      - name: Build Windows installer
        env:
          CSC_LINK: ${{ steps.prepare-signing.outputs.certificate_path }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: npm run desktop:installer

      - name: Verify Authenticode signatures
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLIC_CERTIFICATE: ${{ steps.prepare-signing.outputs.public_certificate_path }}
        run: ./scripts/verify-windows-signing.ps1

      - name: Smoke-test packaged application
        run: |
          npm run desktop:smoke -- --relocate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run desktop:smoke:crash

      - name: Create checksum and signed update manifest
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: npm run release:metadata

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*Setup*.exe \
            dist/*.exe.sha256 \
            dist/Al-Muhtaraz-Code-Signing.cer \
            dist/update-manifest.json \
            --draft \
            --verify-tag \
            --title "المحترز للحاويات $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove signing certificate from runner
        if: always()
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ steps.prepare-signing.outputs.certificate_thumbprint }}
        run: ./scripts/cleanup-windows-signing.ps1
