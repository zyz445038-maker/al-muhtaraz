name: Windows desktop build test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-test
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      WINDOWS_CODE_SIGNING_CERTIFICATE_SHA256: ${{ vars.WINDOWS_CODE_SIGNING_CERTIFICATE_SHA256 }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Validate build configuration
        shell: pwsh
        run: |
          if (-not $env:NEXT_PUBLIC_SUPABASE_URL -or -not $env:NEXT_PUBLIC_SUPABASE_ANON_KEY) {
            throw 'Set the NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY secrets in the release. environment.'
          }

      - name: Prepare Windows code-signing certificate
        id: prepare-signing
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./scripts/prepare-windows-signing.ps1

      - name: Install dependencies
        run: npm ci

      - name: Test update manifest verification
        run: npm run test:update-manifest

      - name: Build Windows installer
        env:
          CSC_LINK: ${{ steps.prepare-signing.outputs.certificate_path }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: npm run desktop:installer

      - name: Verify Authenticode signatures
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLIC_CERTIFICATE: ${{ steps.prepare-signing.outputs.public_certificate_path }}
        run: ./scripts/verify-windows-signing.ps1

      - name: Smoke-test packaged application
        run: |
          npm run desktop:smoke -- --relocate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run desktop:smoke:crash

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -File -Filter '*Setup*.exe'
          if ($installer.Count -ne 1) {
            throw "Expected one Windows Setup installer; found $($installer.Count)."
          }
          $digest = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$($installer[0].FullName).sha256" -Value "$digest  $($installer[0].Name)" -NoNewline

      - name: Upload test build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: al-muhtaraz-windows-build-${{ github.run_number }}
          path: |
            dist/*Setup*.exe
            dist/*.exe.sha256
            dist/Al-Muhtaraz-Code-Signing.cer
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing certificate from runner
        if: always()
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ steps.prepare-signing.outputs.certificate_thumbprint }}
        run: ./scripts/cleanup-windows-signing.ps1
