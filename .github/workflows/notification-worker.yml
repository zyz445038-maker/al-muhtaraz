name: WhatsApp notification worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: whatsapp-notification-worker
  cancel-in-progress: false

jobs:
  process-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send due WhatsApp notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Configure the CRON_SECRET GitHub Actions secret."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            --retry 1 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://al-muhtaraz.vercel.app/api/cron/process-notifications"
