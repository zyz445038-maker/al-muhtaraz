name: Archive import worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: archive-import-worker
  cancel-in-progress: false

jobs:
  process-archive-import:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process one queued archive job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Configure the CRON_SECRET GitHub Actions secret."
            exit 1
          fi
          AUTH_SCHEME="Bear""er"
          curl --fail-with-body --silent --show-error \
            --max-time 75 \
            --retry 1 \
            --retry-delay 5 \
            -H "Authorization: ${AUTH_SCHEME} ${CRON_SECRET}" \
            "https://al-muhtaraz.vercel.app/api/cron/process-archive-imports"
